<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNHAVEN HEAT Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>SUNHAVEN HEAT <span>Cover Studio</span></h1>
    <p class="tagline">Your photos, arranged into a bold multi-panel poster cover. Everything happens on this machine — photos are never uploaded.</p>

    <label class="field">Add photos (fills panels in order)
      <input id="photos" type="file" accept="image/*" multiple>
    </label>

    <div id="thumbs" class="thumbs" aria-label="Panels"></div>
    <p class="hint">Click a panel on the cover to select it, then drag the photo inside it to reposition. <span id="cellLabel"></span></p>

    <label class="field">Panel zoom <span id="zoomValue">100%</span>
      <input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
    </label>
    <div class="row">
      <button id="fillAll" type="button">Fill all panels with selected photo</button>
      <button id="resetView" type="button">Reset panel view</button>
    </div>

    <label class="field">Layout
      <select id="layout"></select>
    </label>
    <label class="field">Colour grade
      <select id="grade"></select>
    </label>
    <label class="field">Cover title
      <input id="title" type="text" maxlength="42" value="SUNHAVEN HEAT">
    </label>
    <label class="field">Credit line
      <input id="credit" type="text" maxlength="48" value="A SUNHAVEN ORIGINAL">
    </label>

    <div class="row exports">
      <button type="button" data-export="1080x1080">Export PNG 1080 × 1080</button>
      <button type="button" data-export="1080x1350">Export PNG 1080 × 1350</button>
      <button type="button" data-export="1920x1080">Export PNG 1920 × 1080</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="Cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
